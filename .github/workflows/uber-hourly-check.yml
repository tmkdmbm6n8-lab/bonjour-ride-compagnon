name: Hourly Uber fare availability check
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Request protected fare probe
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          UBER_CHECK_CRON_SECRET: ${{ secrets.UBER_CHECK_CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$UBER_CHECK_CRON_SECRET" ]; then
            echo "Configure APP_BASE_URL and UBER_CHECK_CRON_SECRET secrets"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 30 \
            --request POST \
            --header "Authorization: Bearer $UBER_CHECK_CRON_SECRET" \
            "${APP_BASE_URL%/}/api/uber-hourly-check"

      - name: Recheck the same 100 benchmark routes (50 batches of 2)
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          UBER_CHECK_CRON_SECRET: ${{ secrets.UBER_CHECK_CRON_SECRET }}
        run: |
          for batch in $(seq 0 49); do
            echo "Benchmark batch $batch/49"
            curl --fail-with-body --silent --show-error --max-time 60 \
              --retry 0 --request POST \
              --header "Authorization: Bearer $UBER_CHECK_CRON_SECRET" \
              "${APP_BASE_URL%/}/api/uber-hourly-check?benchmarkBatch=$batch"
            echo
            sleep 2
          done
