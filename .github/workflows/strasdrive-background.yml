name: StrasDrive background Uber monitoring and AI collection
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: strasdrive-background-uber
  cancel-in-progress: false
jobs:
  check-and-learn:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check Uber and collect one AI observation batch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          UBER_COOKIE: ${{ secrets.UBER_COOKIE }}
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PAYOUT_NOTIFICATION_FROM: ${{ secrets.PAYOUT_NOTIFICATION_FROM }}
        run: node --experimental-specifier-resolution=node scripts/strasdrive-background.mjs
